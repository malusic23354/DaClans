name: DaClans
version: "0.1.3"
main: net.malusic.daclans.DaClans
loader: net.malusic.daclans.DaClansLoader
api-version: "1.21.11"
description: Simple clans plugin
authors: [Malusic]
permissions:
  daclans.command.create:
    default: true
  daclans.command.disband:
    default: true
  daclans.command.rename:
    default: true
  daclans.command.invite:
    default: true
  daclans.command.join:
    default: true
  daclans.command.leave:
    default: true
  daclans.command.promote:
    default: true
  daclans.command.demote:
    default: true
  daclans.command.setowner:
    default: true
  daclans.command.kick:
    default: true
  daclans.command.settings:
    default: true
  daclans.command.ally:
    default: true
  daclans.command.enemy:
    default: true
  daclans.command.warn:
    default: true
  daclans.command.deposit:
    default: true
  daclans.command.withdraw:
    default: true
  daclans.command.top:
    default: true
  daclans.command.info:
    default: true
  daclans.command.list:
    default: true
  daclans.command.members:
    default: true
  daclans.command.description:
    default: true
  daclans.command.logs:
    default: true
  daclans.command.logs.others:
    default: op
  daclans.command.cc:
    default: true
  daclans.command.ac:
    default: true
  daclans.command.version:
    default: true
  daclans.command.color:
    default: true
  daclans.command.color.default:
    default: true
  daclans.command.color.hex:
    default: true
  daclans.command.reload:
    default: op
  daclans.antiteam.notify:
    default: op
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    CarbonChat:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    BountyLite:
      load: BEFORE
      required: false
      join-classpath: true