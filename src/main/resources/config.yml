storage:
  type: sqlite
  sqlite:
    file: clans.db
  mysql:
    host: localhost
    port: 3306
    database: daclans
    username: root
    password: ""

hooks:
  placeholderapi: true
  nexo: true
  bountylite: true
  vault: true
  carbonchat: true

clan:
  name-regex: "[A-Za-z0-9_]{3,16}"
  max-members: 10
  invite-expiry-seconds: 60
  ally-request-expiry-seconds: 120
  cleanup-seconds: 60
  list-page-size: 10
  description-max-length: 120
  bank-logs:
    max: 20
    retention-days: 30
  last-seen:
    enabled: true
    online-text: "Online"
    offline-text: "Offline"
  inactivity:
    enabled: false
    days: 30
    check-minutes: 30
    action: transfer

chat:
  enabled: true
  clan-format: "<gray>[Clan] <white><player>: <message>"
  ally-format: "<gray>[Ally] <white><player>: <message>"
  carbon:
    enabled: true

ranks:
  member:
    level: 1
    displayname: "<gray>Member"
    material: IRON_INGOT
    glowing: false
    lore:
      - "<dark_gray>Basic clan rank"
  officer:
    level: 2
    displayname: "<yellow>Officer"
    material: GOLD_INGOT
    glowing: false
    lore:
      - "<dark_gray>Trusted clan rank"
  coleader:
    level: 3
    displayname: "<gold>Co-Leader"
    material: DIAMOND
    glowing: false
    lore:
      - "<dark_gray>Second in command"
  leader:
    level: 100
    displayname: "<red>Leader"
    material: NETHERITE_INGOT
    glowing: true
    lore:
      - "<dark_gray>Clan owner"

default-permissions:
  invite: member
  kick: officer
  rename: leader
  settings: coleader
  warn: officer
  description: leader

damage-reduction:
  clan: 0
  allies: 0

anti-teaming:
  enabled: true
  threshold: 2
  window-seconds: 15
  per-clan-cooldown-seconds: 60

leaderboard:
  enabled: true
  sort: bank
  page-size: 10
  refresh-seconds: 60

bounty:
  allow-on-teammates: false
  commands:
    - bounty
  blocked-subcommands:
    - set
    - bet

messages:
  player-only: "<red>Players only."
  no-permission: "<red>You do not have permission to do that."
  already-in-clan: "<red>You are already in a clan."
  not-in-clan: "<red>You are not in a clan."
  not-leader: "<red>Only the clan leader can do this."
  not-member: "<red>That player is not in your clan."
  invalid-name: "<red>Invalid clan name."
  invalid-target: "<red>Invalid target."
  name-taken: "<red>The clan <name> already exists."
  no-such-clan: "<red>Clan <name> does not exist."
  created: "<green>Clan <name> created."
  disbanded: "<yellow>Clan <name> was disbanded."
  renamed: "<green>Clan renamed to <name>."
  color-set: "<green>Clan color updated."
  invalid-color: "<red>Invalid color. Use a named color or a hex color like #ff0000."
  invite-no-permission: "<red>You cannot invite players."
  player-not-found: "<red>Player not found."
  invite-self: "<red>You cannot invite yourself."
  target-in-clan: "<red><player> is already in a clan."
  clan-full: "<red>The clan is full."
  invited: "<green>Invited <player>."
  invite-received: "<yellow><player> invited you to <name>. Use /clan join <name>"
  join-specify: "<red>Specify the clan to join."
  no-invite: "<red><name> is invite only."
  joined: "<green>You joined <name>."
  member-joined: "<yellow><player> joined the clan."
  leader-cannot-leave: "<red>Leaders cannot leave. Disband or transfer ownership."
  left: "<yellow>You left <name>."
  member-left: "<yellow><player> left the clan."
