  deposited: "<green>Deposited <amount> into the clan bank."
  withdrawn: "<green>Withdrew <amount> from the clan bank."
  leaderboard-disabled: "<red>The leaderboard is disabled."
  top-header: "<gold>Top clans by <type> (<page>/<pages>)"
